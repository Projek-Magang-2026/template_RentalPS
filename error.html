<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection Interrupted - PLAYZONE WiFi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container" style="justify-content: center; align-items: center; padding: 24px;">
    <!-- Main Card -->
    <main class="main-card" style="flex: none; width: 100%; border: 1px solid var(--card-border); border-radius: 20px; padding: 36px 22px; background-color: var(--card-bg-elevated);">
        
        <div class="portal-welcome" style="margin-bottom: 24px; text-align: center;">
            <h2 class="portal-title">KONEKSI <span style="color: #ef4444;">GAGAL</span></h2>
            <p class="portal-subtitle">Terjadi kendala saat mencoba menghubungkan ke PLAYZONE WiFi</p>
        </div>

        <!-- Error Box -->
        <div class="error-box" style="margin-bottom: 24px;">
            <span style="font-size: 16px;">⚠️</span>
            <div>
                <strong>Informasi Kendala:</strong><br>
                <span>$(error-message)</span>
            </div>
        </div>

        <!-- Return button -->
        <a href="login.html" class="btn-primary" style="text-decoration: none;">
            Kembali ke Login
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" />
            </svg>
        </a>

        <!-- Footer brand logo -->
        <footer class="brand-footer" style="margin-top: 32px; text-align: center;">
            &copy; 2026 PLAYZONE Gaming Lounge. All Rights Reserved.
        </footer>
    </main>
</div>

</body>
</html>
