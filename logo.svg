<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Shield/Circle Base -->
  <rect x="5" y="5" width="90" height="90" rx="28" fill="url(#bg-grad)" stroke="url(#accent-grad)" stroke-width="2.5" />

  <!-- Outer WiFi Wave -->
  <path d="M 28 32 A 28 28 0 0 1 72 32" stroke="url(#accent-grad)" stroke-width="3.5" stroke-linecap="round" opacity="0.4" />
  <!-- Inner WiFi Wave -->
  <path d="M 36 39 A 18 18 0 0 1 64 39" stroke="url(#accent-grad)" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />

  <!-- Controller Body -->
  <path d="M 26 54 C 26 48, 34 46, 50 46 C 66 46, 74 48, 74 54 C 74 66, 70 76, 62 76 C 58 76, 55 72, 50 72 C 45 72, 42 76, 38 76 C 30 76, 26 66, 26 54 Z" fill="#121524" stroke="url(#accent-grad)" stroke-width="3" filter="url(#glow)" />

  <!-- D-Pad Left -->
  <path d="M 34 53 H 40 M 37 50 V 56" stroke="#00d2ff" stroke-width="2.5" stroke-linecap="round" />

  <!-- Action Buttons Right (X, Y, A, B dots) -->
  <circle cx="63" cy="50" r="1.8" fill="#8b5cf6" />
  <circle cx="67" cy="53" r="1.8" fill="#00d2ff" />
  <circle cx="59" cy="53" r="1.8" fill="#3b82f6" />
  <circle cx="63" cy="57" r="1.8" fill="#10b981" />

  <!-- Center PS Button / Glowing Dot -->
  <circle cx="50" cy="58" r="3" fill="url(#accent-grad)" />
</svg>
